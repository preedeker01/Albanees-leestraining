<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#123487">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Albanees">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>Albanese leestraining</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section id="homeScreen" class="screen active"><div class="home">
  <div class="home-head"><h1>Albanese<br>leestraining</h1><div class="home-sub">Albanese letters en woorden oefenen</div></div>
  <div class="home-buttons">
    <button class="home-choice green" onclick="showScreen('lettersScreen')"><span class="label">Letters</span><span class="tiles"><span class="tile">A</span><span class="tile">B</span><span class="tile">Ç</span></span></button>
    <button class="home-choice blue" onclick="openWords(3)"><span class="label">3 letters</span><span class="tiles"><span class="tile">u</span><span class="tile">j</span><span class="tile">ë</span></span></button>
    <button class="home-choice orange" onclick="openWords(4)"><span class="label">4 letters</span><span class="tiles"><span class="tile">b</span><span class="tile">u</span><span class="tile">k</span><span class="tile">ë</span></span></button>
    <button class="home-choice purple" onclick="openWords(5)"><span class="label">5 letters</span><span class="tiles"><span class="tile">l</span><span class="tile">i</span><span class="tile">b</span><span class="tile">ë</span><span class="tile">r</span></span></button>
    <button class="home-choice red" onclick="openWords(6)"><span class="label">6 letters</span><span class="tiles"><span class="tile">m</span><span class="tile">a</span><span class="tile">k</span><span class="tile">i</span><span class="tile">n</span><span class="tile">ë</span></span></button>
    <button class="home-choice teal" onclick="openWords(7)"><span class="label">7 letters</span><span class="tiles"><span class="tile">t</span><span class="tile">e</span><span class="tile">l</span><span class="tile">e</span><span class="tile">f</span><span class="tile">o</span><span class="tile">n</span></span></button>
    <button class="home-choice gold sentence-home" onclick="openSentences()"><span class="label">Korte zinnen</span><span class="tiles"><span class="tile">Unë</span><span class="tile">shkoj</span><span class="tile">në shtëpi</span></span></button>
  </div>
  <div class="voice-row"><label for="neuralVoice">Albanese stem:</label><select id="neuralVoice"><option value="anila">Anila (vrouw)</option><option value="ilir">Ilir (man)</option></select><button id="voiceTest" type="button">▶ Test</button></div>
  <div class="data-row"><div id="dataStatus" class="data-status">Woordenlijst voorbereiden…</div></div>
</div></section>

<section id="lettersScreen" class="screen"><button class="global-home" onclick="showScreen('homeScreen')" title="Start">⌂</button><div class="exercise"><h1>Albanese letters</h1><p id="lettersHint" class="hint">Tik op een letter om hem 3× te horen.</p><div id="lettersGrid" class="grid"></div><div class="controls"><button id="lettersPlay">▶<br>Voorbeeld</button><button id="lettersStop">■<br>Stop</button><button id="lettersMix">↻<br>Mengen</button><button id="lettersSearch">🔎<br>Zoeken</button></div><button id="lettersTranslate" class="translate" style="visibility:hidden">Vertalen</button></div></section>

<section id="wordsScreen" class="screen"><button class="global-home" onclick="showScreen('homeScreen')" title="Start">⌂</button><div id="wordExercise" class="exercise"><h1 id="wordTitle">Albanese woorden</h1><p id="wordHint" class="hint">Tik op een woord om het 3× te horen.</p><div id="wordGrid" class="grid"></div><div class="controls"><button id="wordPlay">▶<br>Voorbeeld</button><button id="wordStop">■<br>Stop</button><button id="wordMix">↻<br>Mengen</button><button id="wordSearch">🔎<br>Zoeken</button></div><button id="wordTranslate" class="translate" aria-pressed="false">🌐 Vertalen</button></div></section>

<section id="sentencesScreen" class="screen"><button class="global-home" onclick="showScreen('homeScreen')" title="Start">⌂</button><div class="exercise"><h1>Korte Albanese zinnen</h1><p id="sentenceHint" class="hint">Tik op een zin om hem woord voor woord te horen.</p><div id="sentenceStage" class="sentence-stage"><div id="sentenceFocus"><span class="focus-text"></span></div><div id="sentenceGrid" class="sentence-grid"></div></div><div class="controls"><button id="sentencePlay">▶<br>Voorbeeld</button><button id="sentenceStop">■<br>Stop</button><button id="sentenceMix">↻<br>Mengen</button><button id="sentenceSearch">🔎<br>Zoeken</button></div><button id="sentenceTranslate" class="translate" aria-pressed="false">🌐 Vertalen</button></div></section>

<div id="updateBox" class="update-box"><span role="status">Nieuwe versie beschikbaar</span><button id="updateBtn">Bijwerken</button></div>
<audio id="goodSound" src="SpeechOn.wav" preload="auto"></audio><audio id="badSound" src="SpeechOff.wav" preload="auto"></audio>
<script src="app.js" defer></script>
</body></html>
